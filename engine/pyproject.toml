[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minutetaker-engine"
version = "1.0.0"
description = "MinuteTaker engine: capture, transcribe, diarize, summarise and export meeting minutes"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "soundfile>=0.12",
  "av>=12",
  "python-docx>=1.1",
  "pypdf>=4",
]

[project.optional-dependencies]
capture = ["soundcard>=0.4.3"]
local-stt = ["faster-whisper>=1.0"]
diarization = ["pyannote.audio>=3.1", "torch"]
keychain = ["keyring>=25"]
all = ["soundcard>=0.4.3", "faster-whisper>=1.0", "keyring>=25"]
dev = ["pytest>=8"]

[project.scripts]
minutetaker = "minutetaker.cli:main"

[tool.setuptools.packages.find]
include = ["minutetaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
